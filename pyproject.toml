[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "azure-devops-audit-logger"
version = "1.0.0"
requires-python = "==3.13.*"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn>=0.30,<1.0",
  "requests>=2.32,<3.0",
  "python-dotenv>=1.1,<2.0",
  "pydantic>=2.0,<3.0",
  "langchain>=1.0,<2.0",
  "langchain-core==1.6.3",
  "langchain-google-genai==4.4.0",
  "google-genai==2.23.0",
  "langgraph==0.6.11",
]

[tool.setuptools]
packages = ["agent"]
